services:
  deposito:
    image: deposito-stock:1.0
    container_name: deposito-stock
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8000"
    environment:
      DATABASE_PATH: /data/deposito.sqlite3
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY en Portainer}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en Portainer}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - deposito_data:/data
  telegram-bot:
    image: deposito-stock:1.0
    container_name: deposito-stock-telegram
    command: ["python", "telegram_bot.py"]
    restart: unless-stopped
    depends_on:
      - deposito
    environment:
      DATABASE_PATH: /data/deposito.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Definí TELEGRAM_BOT_TOKEN en Portainer}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    volumes:
      - deposito_data:/data

volumes:
  deposito_data:
