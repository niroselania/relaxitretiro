<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Etiqueta {{ container.code }}</title><style>body{font-family:Arial,sans-serif;color:#111;margin:0;padding:24px}.label{width:76mm;min-height:38mm;border:1px solid #ddd;padding:6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm;text-align:center}.label img{width:100%;height:21mm}.name{font-size:13pt;font-weight:700;max-width:100%;overflow-wrap:anywhere}.code{font-size:11pt;letter-spacing:1px}@media print{body{padding:0}.label{border:0;break-inside:avoid}@page{size:88mm 50mm;margin:4mm}}</style></head><body><div class="label"><img src="{{ url_for('container_label', container_id=container.id) }}"><div class="name">{{ container.name }}</div><div class="code">{{ container.code }}</div></div><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250))</script></body></html>
